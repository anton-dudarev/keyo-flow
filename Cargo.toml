[package]
name = "keyo-flow"
version = "0.20.0"
edition = "2021"
default-run = "keyo-cli"

[[bin]]
name = "keyo-cli"
path = "src/main.rs"

[[bin]]
name = "keyo-gui"
path = "src/bin/keyo-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "windows-sys/Win32_UI_Controls_Dialogs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "accesskit"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
